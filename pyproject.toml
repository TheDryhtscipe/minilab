[project]
name = "minilab"
version = "0.1.0"
description = "A filter-first search loop for cross-domain ML mathematics"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "mpmath",
    "python-flint",
    "numpy",
    "scipy",
    "httpx",
    "typer",
]

[project.scripts]
minilab = "minilab.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minilab"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "No Any types in minilab (CLAUDE.md). Use an explicit type."
"typing_extensions.Any".msg = "No Any types in minilab (CLAUDE.md). Use an explicit type."

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a live model or web API; run only when asked (-m live)",
]
# Four workers (pytest-xdist): Lean checks dominate the run, and eight workers
# saved two more minutes but left too little memory free. `-n 0` runs in one
# process. Bead minilab-81c4fe.
addopts = "-m 'not live' -n 4"
